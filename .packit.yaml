specfile_path: tcp-brutal.spec
upstream_package_name: tcp-brutal
downstream_package_name: brutalctl
update_release: false
use_copr_dist_git_build: false

srpm_build_deps:
  - bash
  - git
  - curl
  - rpm-build
  - systemd-rpm-macros
  - tar
  - gzip
  - sed
  - grep
  - coreutils
  - diffutils

actions:
  get-current-version:
    - |-
      bash -euo pipefail -c '
        export LC_ALL=C
        cd "$(git rev-parse --show-toplevel)"
        original=$(git show HEAD:tcp-brutal.spec)
        version=$(sed -nE "s/^Version:[[:blank:]]+([0-9]+\.[0-9]+\.[0-9]+)[[:blank:]]*$/\1/p" <<< "$original")
        release=$(sed -nE "s/^Release:[[:blank:]]+([1-9][0-9]*)%\{\?dist\}[[:blank:]]*$/\1/p" <<< "$original")
        [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
        [[ "$release" =~ ^[1-9][0-9]*$ ]]
        archive="tcp-brutal-$version.tar.gz"
        printf "%s\n" "$version"
      '
  create-archive:
    - |-
      bash -euo pipefail -c '
        export LC_ALL=C
        cd "$(git rev-parse --show-toplevel)"
        original=$(git show HEAD:tcp-brutal.spec)
        version=$(sed -nE "s/^Version:[[:blank:]]+([0-9]+\.[0-9]+\.[0-9]+)[[:blank:]]*$/\1/p" <<< "$original")
        release=$(sed -nE "s/^Release:[[:blank:]]+([1-9][0-9]*)%\{\?dist\}[[:blank:]]*$/\1/p" <<< "$original")
        [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
        [[ "$release" =~ ^[1-9][0-9]*$ ]]
        archive="tcp-brutal-$version.tar.gz"
        temp=$(mktemp)
        trap "rm -f -- \"$temp\"" EXIT
        curl --fail --silent --show-error --location --retry 3 \
          --output "$temp" \
          "https://github.com/HyNetworks/tcp-brutal/archive/refs/tags/v$version.tar.gz"
        mv "$temp" "$archive"
        test -s "$archive"
        tar -tzf "$archive" \
          "tcp-brutal-$version/brutal.h" \
          "tcp-brutal-$version/brutal_cc.c" \
          "tcp-brutal-$version/brutal_rules.c" \
          "tcp-brutal-$version/brutal_sockopt.c" \
          "tcp-brutal-$version/Makefile" \
          "tcp-brutal-$version/tools/brutalctl.c" \
          "tcp-brutal-$version/scripts/mkdkmsconf.sh" >/dev/null
        printf "%s\n" "$archive"
      '
  fix-spec-file:
    - |-
      bash -euo pipefail -c '
        export LC_ALL=C
        cd "$(git rev-parse --show-toplevel)"
        original=$(git show HEAD:tcp-brutal.spec)
        version=$(sed -nE "s/^Version:[[:blank:]]+([0-9]+\.[0-9]+\.[0-9]+)[[:blank:]]*$/\1/p" <<< "$original")
        release=$(sed -nE "s/^Release:[[:blank:]]+([1-9][0-9]*)%\{\?dist\}[[:blank:]]*$/\1/p" <<< "$original")
        [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
        [[ "$release" =~ ^[1-9][0-9]*$ ]]
        archive="tcp-brutal-$version.tar.gz"
        test -s "$archive"
        sed -E "s|^Source0:.*|Source0:        $archive|" <<< "$original" > tcp-brutal.spec
      '
  post-modifications:
    - |-
      bash -euo pipefail -c '
        export LC_ALL=C
        cd "$(git rev-parse --show-toplevel)"
        original=$(git show HEAD:tcp-brutal.spec)
        version=$(sed -nE "s/^Version:[[:blank:]]+([0-9]+\.[0-9]+\.[0-9]+)[[:blank:]]*$/\1/p" <<< "$original")
        release=$(sed -nE "s/^Release:[[:blank:]]+([1-9][0-9]*)%\{\?dist\}[[:blank:]]*$/\1/p" <<< "$original")
        [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
        [[ "$release" =~ ^[1-9][0-9]*$ ]]
        archive="tcp-brutal-$version.tar.gz"
        test -s "$archive"
        tar -tzf "$archive" \
          "tcp-brutal-$version/brutal.h" \
          "tcp-brutal-$version/brutal_cc.c" \
          "tcp-brutal-$version/brutal_rules.c" \
          "tcp-brutal-$version/brutal_sockopt.c" \
          "tcp-brutal-$version/Makefile" \
          "tcp-brutal-$version/tools/brutalctl.c" \
          "tcp-brutal-$version/scripts/mkdkmsconf.sh" >/dev/null
        diff -u <(sed -E "s|^Source0:.*|Source0:        $archive|" <<< "$original") tcp-brutal.spec
      '

jobs:
  - job: copr_build
    trigger: release
    owner: repobot
    project: tcp-brutal
    targets:
      - fedora-43-s390x
      - fedora-43-x86_64
      - fedora-43-ppc64le
      - fedora-43-aarch64
      - fedora-43-riscv64
      - fedora-44-s390x
      - fedora-44-x86_64
      - fedora-44-ppc64le
      - fedora-44-aarch64
      - fedora-44-riscv64
      - fedora-45-s390x
      - fedora-45-x86_64
      - fedora-45-ppc64le
      - fedora-45-aarch64
      - fedora-45-riscv64
      - rhel-10-s390x
      - rhel-10-x86_64
      - rhel-10-ppc64le
      - rhel-10-aarch64
      - epel-10-s390x
      - epel-10-x86_64
      - epel-10-ppc64le
      - epel-10-aarch64
    enable_net: false
