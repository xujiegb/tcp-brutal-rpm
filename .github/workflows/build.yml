name: Build RPM

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tcp-brutal-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish build release
        shell: bash
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          spec=$(gh api "repos/$GITHUB_REPOSITORY/contents/tcp-brutal.spec?ref=$sha" --jq .content | base64 -d)
          version=$(sed -nE 's/^Version:[[:blank:]]+([0-9]+\.[0-9]+\.[0-9]+)[[:blank:]]*$/\1/p' <<< "$spec")
          release=$(sed -nE 's/^Release:[[:blank:]]+([1-9][0-9]*)%\{\?dist\}[[:blank:]]*$/\1/p' <<< "$spec")
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$release" =~ ^[1-9][0-9]*$ ]]
          tag="v$version-$release"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Retry its Packit check or increment the RPM release."
            exit 1
          fi
          workdir=$(mktemp -d)
          trap 'rm -rf "$workdir"' EXIT
          git clone --quiet "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$workdir/repo"
          git -C "$workdir/repo" checkout --quiet --detach "$sha"
          docker run --rm \
            -v "$workdir/repo:/work" -w /work \
            -e EXPECTED_VERSION="$version" -e EXPECTED_RELEASE="$release" \
            registry.fedoraproject.org/fedora:44 bash -euo pipefail -c '
              dnf -y install packit git curl rpm-build systemd-rpm-macros tar gzip sed grep coreutils diffutils gcc glibc-devel make
              git config --global --add safe.directory /work
              packit config validate
              packit --debug prepare-sources --job-config-index 0 --no-update-release --no-create-symlinks --result-dir /tmp/prepared /work
              prepared_spec=$(find /tmp/prepared -type f -name tcp-brutal.spec)
              test -f "$prepared_spec"
              prepared_dir=$(dirname "$prepared_spec")
              archive="tcp-brutal-$EXPECTED_VERSION.tar.gz"
              grep -Fx "Version:        $EXPECTED_VERSION" "$prepared_spec"
              grep -Fx "Release:        $EXPECTED_RELEASE%{?dist}" "$prepared_spec"
              grep -Fx "Source0:        $archive" "$prepared_spec"
              test -f "$prepared_dir/$archive"
              tar -tzf "$prepared_dir/$archive" "tcp-brutal-$EXPECTED_VERSION/brutal_cc.c" "tcp-brutal-$EXPECTED_VERSION/tools/brutalctl.c" >/dev/null
              mkdir -p /tmp/rpmbuild/BUILD
              rpmbuild -bp --nodeps --define "_sourcedir $prepared_dir" --define "_builddir /tmp/rpmbuild/BUILD" "$prepared_spec"
            '
          ref=$(git ls-remote --refs "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "refs/tags/$tag")
          if [[ -n "$ref" ]]; then
            if [[ "$ref" != "$sha"$'\t'"refs/tags/$tag" ]]; then
              echo "::error::Tag $tag already points to another commit."
              exit 1
            fi
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$sha" >/dev/null
          fi
          url=$(gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --title "TCP Brutal $version-$release" --notes "Build TCP Brutal $version-$release for Fedora, RHEL and EPEL in COPR.")
          printf 'Published release: %s\n\n[COPR builds](https://copr.fedorainfracloud.org/coprs/repobot/tcp-brutal/builds/)\n' "$url" >> "$GITHUB_STEP_SUMMARY"
