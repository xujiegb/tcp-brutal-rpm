specfile_path: tcp-brutal.spec
upstream_package_name: tcp-brutal
downstream_package_name: brutalctl
update_release: false
use_copr_dist_git_build: false

srpm_build_deps:
  - bash
  - git
  - curl
  - rpm-build
  - systemd-rpm-macros
  - tar
  - gzip
  - sed
  - grep
  - coreutils
  - diffutils

actions:
  get-current-version:
    - bash packaging/prepare-source.sh version
  create-archive:
    - bash packaging/prepare-source.sh archive
  fix-spec-file:
    - bash packaging/prepare-source.sh spec
  post-modifications:
    - bash packaging/prepare-source.sh verify

jobs:
  - job: copr_build
    trigger: release
    owner: repobot
    project: tcp-brutal
    targets:
      - fedora-43-s390x
      - fedora-43-x86_64
      - fedora-43-ppc64le
      - fedora-43-aarch64
      - fedora-43-riscv64
      - fedora-44-s390x
      - fedora-44-x86_64
      - fedora-44-ppc64le
      - fedora-44-aarch64
      - fedora-44-riscv64
      - fedora-45-s390x
      - fedora-45-x86_64
      - fedora-45-ppc64le
      - fedora-45-aarch64
      - fedora-45-riscv64
      - rhel-10-s390x
      - rhel-10-x86_64
      - rhel-10-ppc64le
      - rhel-10-aarch64
      - epel-10-s390x
      - epel-10-x86_64
      - epel-10-ppc64le
      - epel-10-aarch64
    enable_net: false
