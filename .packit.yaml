specfile_path: tcp-brutal.spec
upstream_package_name: tcp-brutal
downstream_package_name: brutalctl
update_release: false

srpm_build_deps: &srpm_deps
  - bash
  - curl
  - rpm-build
  - systemd-rpm-macros
  - tar
  - gzip
  - sed
  - grep

actions: &source_actions
  get-current-version:
    - >-
      bash -eu -c 'sed -nE "s/^Version:[[:blank:]]+([0-9]+\.[0-9]+\.[0-9]+)[[:blank:]]*$/\1/p" tcp-brutal.spec'
  create-archive:
    - >-
      bash -euo pipefail -c 'version=$(sed -nE "s/^Version:[[:blank:]]+([0-9]+\.[0-9]+\.[0-9]+)[[:blank:]]*$/\1/p" tcp-brutal.spec);
      [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]];
      archive="tcp-brutal-${version}.tar.gz";
      curl --fail --silent --show-error --location --retry 3
      --output "$archive"
      "https://github.com/HyNetworks/tcp-brutal/archive/refs/tags/v${version}.tar.gz";
      tar -tzf "$archive" "tcp-brutal-${version}/tools/brutalctl.c" "tcp-brutal-${version}/brutal_cc.c" "tcp-brutal-${version}/scripts/mkdkmsconf.sh" >/dev/null;
      printf "%s\n" "$archive"'
  fix-spec-file:
    - >-
      bash -euo pipefail -c 'version=$(sed -nE "s/^Version:[[:blank:]]+([0-9]+\.[0-9]+\.[0-9]+)[[:blank:]]*$/\1/p" tcp-brutal.spec);
      [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]];
      archive="tcp-brutal-${version}.tar.gz";
      test -s "$archive";
      sed -i -E "s|^Source0:.*|Source0:        $archive|" tcp-brutal.spec'
  post-modifications:
    - >-
      bash -euo pipefail -c 'version=$(sed -nE "s/^Version:[[:blank:]]+([0-9]+\.[0-9]+\.[0-9]+)[[:blank:]]*$/\1/p" tcp-brutal.spec);
      [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]];
      archive="tcp-brutal-${version}.tar.gz";
      grep -Fx "Source0:        $archive" tcp-brutal.spec;
      tar -tzf "$archive" "tcp-brutal-${version}/tools/brutalctl.c" "tcp-brutal-${version}/brutal_cc.c" >/dev/null'

jobs:
  - job: copr_build
    trigger: release
    owner: repobot
    project: tcp-brutal
    update_release: false
    srpm_build_deps: *srpm_deps
    actions: *source_actions
    targets:
      - fedora-43-s390x
      - fedora-43-x86_64
      - fedora-43-ppc64le
      - fedora-43-aarch64
      - fedora-43-riscv64
      - fedora-44-s390x
      - fedora-44-x86_64
      - fedora-44-ppc64le
      - fedora-44-aarch64
      - fedora-44-riscv64
      - fedora-45-s390x
      - fedora-45-x86_64
      - fedora-45-ppc64le
      - fedora-45-aarch64
      - fedora-45-riscv64
      - rhel-10-s390x
      - rhel-10-x86_64
      - rhel-10-ppc64le
      - rhel-10-aarch64
      - epel-10-s390x
      - epel-10-x86_64
      - epel-10-ppc64le
      - epel-10-aarch64
    enable_net: false
