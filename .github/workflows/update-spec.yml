name: Update SPEC Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: Upstream version (for example 2.0.2)
        required: true
        type: string
      release:
        description: RPM release number
        required: true
        default: '1'
        type: string

permissions:
  contents: write

concurrency:
  group: tcp-brutal-release
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      NEW_VERSION: ${{ inputs.version }}
      NEW_RELEASE: ${{ inputs.release }}
    steps:
      - name: Update SPEC
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          version="${NEW_VERSION#v}"
          release="$NEW_RELEASE"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ || ! "$release" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Enter a three-part upstream version and a positive integer release."
            exit 1
          fi
          git ls-remote --exit-code --refs https://github.com/HyNetworks/tcp-brutal.git "refs/tags/v$version" >/dev/null
          endpoint="repos/$GITHUB_REPOSITORY/contents/tcp-brutal.spec"
          current=$(gh api "$endpoint?ref=main")
          sha=$(jq -er .sha <<< "$current")
          workdir=$(mktemp -d)
          trap 'rm -rf "$workdir"' EXIT
          spec="$workdir/tcp-brutal.spec"
          jq -er .content <<< "$current" | base64 -d > "$spec"
          old_version=$(sed -nE 's/^Version:[[:blank:]]+([0-9]+\.[0-9]+\.[0-9]+)[[:blank:]]*$/\1/p' "$spec")
          old_release=$(sed -nE 's/^Release:[[:blank:]]+([1-9][0-9]*)%\{\?dist\}[[:blank:]]*$/\1/p' "$spec")
          if [[ ! "$old_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ || ! "$old_release" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Unexpected SPEC version or release format."
            exit 1
          fi
          if [[ $(grep -c '^Version:' "$spec") != 1 || $(grep -c '^Release:' "$spec") != 1 || $(grep -c '^%changelog$' "$spec") != 1 ]]; then
            echo "::error::Unexpected SPEC structure."
            exit 1
          fi
          old="$old_version-$old_release"
          new="$version-$release"
          if [[ "$new" == "$old" ]]; then
            echo "SPEC already has version $new."
            exit 0
          fi
          if [[ $(printf '%s\n' "$old" "$new" | sort -V | tail -n 1) != "$new" ]]; then
            echo "::error::Refusing to downgrade from $old to $new."
            exit 1
          fi
          sed -i -E "s/^(Version:[[:blank:]]*).*/\1$version/; s/^(Release:[[:blank:]]*).*/\1$release%{?dist}/" "$spec"
          stamp=$(date -u '+%a %b %d %Y')
          awk -v stamp="$stamp" -v nvr="$new" '
            { print }
            /^%changelog$/ {
              printf "* %s TCP Brutal RPM maintainers <packaging@example.invalid> - %s\n- Update package to %s.\n\n", stamp, nvr, nvr
            }
          ' "$spec" > "$workdir/updated.spec"
          content=$(base64 -w0 "$workdir/updated.spec")
          url=$(gh api --method PUT "$endpoint" -f message="Update TCP Brutal to $new" -f content="$content" -f sha="$sha" -f branch=main --jq .commit.html_url)
          printf 'Updated SPEC to %s: %s\n\nRun Build RPM to publish the release and trigger Packit.\n' "$new" "$url" >> "$GITHUB_STEP_SUMMARY"
